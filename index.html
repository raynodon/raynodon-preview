<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>raynodon | Music Maker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- 1. 基础布局 --- */
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('bg.jpg');
            background-size: cover; background-repeat: no-repeat; background-position: center; background-attachment: fixed; background-color: #0a0a0a; 
            color: #eee; margin: 0; padding: 40px 20px; line-height: 1.6; display: flex; justify-content: center; 
        }
        .container { max-width: 600px; width: 100%; position: relative; }
        
        /* --- 2. 侧边“广告”委托模块 --- */
        .side-commission {
            position: fixed; right: 20px; top: 150px; width: 200px;
            padding: 20px; border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.9), rgba(124, 58, 237, 0.9));
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; backdrop-filter: blur(10px);
        }
        .side-commission h2 { font-size: 1.1rem; margin-top: 0; }
        .side-commission p { font-size: 0.85rem; opacity: 0.9; }

        /* --- 3. 模块通用样式 --- */
        .section { 
            margin-bottom: 30px; padding: 25px; border-radius: 18px; 
            background: rgba(15, 15, 15, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); 
        }
        .support-box { border: 1px solid #9013fe; background: rgba(144, 19, 254, 0.1); }
        
        /* 名字动画 */
        h1 { font-size: 2.5rem; margin-bottom: 5px; animation: glow 3s ease-in-out infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 5px #fff; opacity: 0.8; } to { text-shadow: 0 0 20px #7c3aed, 0 0 30px #4f46e5; opacity: 1; } }

        /* 社交图标样式 */
        .social-icons { margin-top: 20px; display: flex; gap: 15px; font-size: 1.5rem; }
        .social-icons a { color: #888; transition: 0.3s; }
        .social-icons a:hover { color: #fff; transform: translateY(-3px); }

        /* 按钮与导航 */
        .lang-nav { text-align: right; margin-bottom: 25px; }
        .lang-nav a { color: #888; text-decoration: none; margin-left: 15px; font-size: 13px; border: 1px solid #333; padding: 4px 10px; border-radius: 6px; transition: 0.3s; background: rgba(0,0,0,0.5); }
        .btn { display: inline-block; padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px; transition: 0.3s; font-size: 13px; }
        .btn-filled { background: #fff; color: #000; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.4); color: #fff; margin-right: 8px; }

        /* 响应式：手机端侧边栏变到底部 */
        @media (max-width: 1100px) {
            .side-commission { position: relative; width: auto; right: 0; top: 0; margin-bottom: 30px; order: -1; }
        }

        /* 语言切换逻辑 */
        .lang-block { display: none; } #en { display: block; }
        #zh:target, #ja:target, #en:target { display: block; }
        #zh:target ~ #en, #ja:target ~ #en { display: none; }
        #zh:target ~ #ja, #ja:target ~ #zh { display: none; }
    </style>
</head>
<body>
