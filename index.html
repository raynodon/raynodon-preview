        }
        .container { max-width: 600px; width: 100%; margin-top: 10px; }

        /* 侧边委托栏 */
        .side-commission {
            position: fixed; right: 30px; top: 100px; width: 180px; padding: 20px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.9), rgba(124, 58, 237, 0.9));
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000;
        }
        .side-commission h2 { font-size: 1rem; margin: 0 0 10px 0; color: #fff; }
        .side-email { font-size: 0.8rem; display: block; margin-top: 10px; color: #fff; font-weight: bold; text-align: center; }

        .section { margin-bottom: 20px; padding: 25px; border-radius: 18px; background: rgba(15, 15, 15, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .mini-section { padding: 15px 25px; margin-bottom: 20px; border-radius: 15px; background: rgba(144, 19, 254, 0.15); border: 1px solid rgba(144, 19, 254, 0.3); display: flex; align-items: center; justify-content: space-between; }

        /* 顶部布局修复：头像 + 名字 + SNS */
        .profile-header { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); object-fit: cover; }
        .profile-content { flex: 1; }

        /* 极高亮名字 */
        h1 { 
            font-size: 2.4rem; margin: 0; color: #fff; line-height: 1.1;
            text-shadow: 0 0 15px #fff, 0 0 30px #7c3aed;
            animation: glow-strong 2s ease-in-out infinite alternate; 
        }
        @keyframes glow-strong { from { opacity: 0.85; } to { opacity: 1; text-shadow: 0 0 20px #fff, 0 0 40px #7c3aed, 0 0 50px #4f46e5; } }

        .sns-icons { margin-top: 10px; display: flex; gap: 15px; font-size: 1.25rem; }
        .sns-icons a { color: rgba(255,255,255,0.7); transition: 0.3s; }
        .sns-icons a:hover { color: #fff; transform: translateY(-2px); }

        .lang-nav { text-align: right; margin-bottom: 15px; }
        .lang-nav a { color: #888; text-decoration: none; margin-left: 10px; font-size: 11px; border: 1px solid #333; padding: 4px 10px; border-radius: 20px; background: rgba(0,0,0,0.5); }

        .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; transition: 0.3s; text-align: center; }
        .btn-filled { background: #fff; color: #000; width: 100%; box-sizing: border-box; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.3); color: #fff; margin-top: 5px; margin-right: 5px; }

        /* 手机端适配 */
        @media (max-width: 1000px) { .side-commission { position: relative; right: 0; top: 0; width: auto; margin-bottom: 20px; } }

        /* 语言显示逻辑 - 已加固 */
        .lang-block { display: none; }
        #en { display: block; } /* 初始进入页面默认显示英文版块 */
        #en:target, #zh:target, #ja:target { display: block; }
        #zh:target ~ #en, #ja:target ~ #en { display: none; }
    </style>
</head>
