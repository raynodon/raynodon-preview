        @keyframes glow { from { text-shadow: 0 0 5px #fff; opacity: 0.8; } to { text-shadow: 0 0 20px #7c3aed; opacity: 1; } }

        .social-icons a { color: #aaa; transition: 0.3s; text-decoration: none; }

        .btn-filled { background: #fff; color: #000; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.3); color: #fff; margin-top: 5px; margin-right: 5px; }

        @media (max-width: 1000px) {
            .side-commission { position: relative; right: 0; top: 0; width: auto; margin-bottom: 20px; }
        }

        .lang-block { display: none; }
        #en { display: block; }
