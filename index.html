    <style>
        /* 1. 基础环境：确保背景不会遮挡内容 */
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('bg.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            background-color: #0a0a0a; color: #eee; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .container { max-width: 600px; width: 100%; z-index: 2; }

        /* 2. 侧边栏：独立定位 */
        .side-commission {
            position: fixed; right: 30px; top: 100px; width: 180px; padding: 20px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.9), rgba(124, 58, 237, 0.9));
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000;
        }
        .side-email { font-size: 0.8rem; display: block; margin-top: 10px; color: #fff; font-weight: bold; text-align: center; }

        /* 3. 核心版块样式 */
        .section { margin-bottom: 20px; padding: 25px; border-radius: 18px; background: rgba(15, 15, 15, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }
        .mini-section { padding: 15px 25px; margin-bottom: 20px; border-radius: 15px; background: rgba(144, 19, 254, 0.2); border: 1px solid rgba(144, 19, 254, 0.4); display: flex; align-items: center; justify-content: space-between; }

        /* 4. 简介区域布局：头像 + (名字 & SNS) */
        .profile-header { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; }
        .profile-text { flex: 1; }

        h1 { 
            font-size: 2.5rem; margin: 0; color: #fff; 
            text-shadow: 0 0 15px #7c3aed, 0 0 30px #4f46e5;
            animation: glow 2s infinite alternate; 
        }
        @keyframes glow { from { opacity: 0.8; } to { opacity: 1; } }

        .sns-icons { margin-top: 10px; display: flex; gap: 18px; font-size: 1.4rem; }
        .sns-icons a { color: rgba(255,255,255,0.7); text-decoration: none; transition: 0.3s; }
        .sns-icons a:hover { color: #fff; transform: scale(1.1); }

        .lang-nav { text-align: right; margin-bottom: 15px; }
        .lang-nav a { color: #888; text-decoration: none; margin-left: 10px; font-size: 11px; border: 1px solid #444; padding: 4px 12px; border-radius: 20px; background: #000; }

        .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-filled { background: #fff; color: #000; width: 100%; text-align: center; box-sizing: border-box; }
        .btn-outline { border: 1px solid #fff; color: #fff; margin-top: 5px; margin-right: 5px; }

        @media (max-width: 1000px) { .side-commission { position: relative; right: 0; top: 0; width: auto; margin-bottom: 20px; } }

        /* 5. 简单的隐藏/显示逻辑：彻底杜绝白屏 */
        .lang-block { display: none; }
        .lang-block:target { display: block; }
        /* 默认如果没有 target，显示英文版块 */
        #en { display: block; }
        #zh:target ~ #en, #ja:target ~ #en { display: none; }
    </style>
</head>
