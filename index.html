<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>raynodon | Music Maker</title>
    <style>
        /* --- 1. 背景与亮度调节 --- */
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            /* 0.2 的遮罩让背景图非常清晰亮丽 */
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0a0a0a; 
            color: #eee; 
            margin: 0; 
            padding: 40px 20px; 
            line-height: 1.6; 
            display: flex; 
            justify-content: center; 
        }
        .container { max-width: 600px; width: 100%; }
        
        /* 名字呼吸灯动画 */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            animation: glow 3s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 5px #fff; opacity: 0.8; }
            to { text-shadow: 0 0 20px #7c3aed, 0 0 30px #4f46e5; opacity: 1; }
        }

        /* 导航与模块 */
        .lang-nav { text-align: right; margin-bottom: 25px; }
        .lang-nav a { color: #888; text-decoration: none; margin-left: 15px; font-size: 13px; border: 1px solid #333; padding: 4px 10px; border-radius: 6px; transition: 0.3s; background: rgba(0,0,0,0.4); }
        .lang-nav a:hover { color: #fff; border-color: #fff; background: rgba(255,255,255,0.1); }

        .section { 
            margin-bottom: 30px; 
            padding: 25px; 
            border-radius: 18px; 
            background: rgba(15, 15, 15, 0.5); /* 模块半透明，让亮色背景透出来 */
            border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px); 
        }
        .commission-box { background: linear-gradient(135deg, rgba(79, 70, 229, 0.7), rgba(124, 58, 237, 0.7)); border: none; box-shadow: 0 10px 30px rgba(79, 70, 229, 0.2); }
        .support-box { border: 1px solid #9013fe; background: rgba(144, 19, 254, 0.1); }

        .btn { display: inline-block; padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 15px; transition: 0.3s; font-size: 14px; }
        .btn-filled { background: #fff; color: #000; border: none; }
        .btn-outline { border: 1px solid rgba(255,255,255,0.4); color: #fff; margin-right: 10px; margin-top: 10px; }
        .btn-outline:hover { border-color: #9013fe; background: rgba(144, 19, 254, 0.2); }

        /* 切换逻辑 */
        .lang-block { display: none; } 
        #zh { display: block; } 
        #zh:target, #ja:target, #en:target { display: block; } 
        #ja:target ~ #zh, #en:target ~ #zh { display: none; } 
        #ja:target ~ #en, #en:target ~ #ja { display: none; }
    </style>
</head>
<body>

        <a href="#zh">CN</a>
        <a href="#ja">JP</a>
        <a href="#en">EN</a>
    </div>
